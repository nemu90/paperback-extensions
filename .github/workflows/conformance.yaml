name: Conformance

# Type-checks, lints and format-checks the sources on every push and PR.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run conformance checks
        run: npm run conformance
